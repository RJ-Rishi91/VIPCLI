services:
  - type: web
    name: envirorise-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_KEY
        value: envirorise2026
    healthCheckPath: /api/health
